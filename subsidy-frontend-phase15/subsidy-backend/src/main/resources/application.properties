
# =========================================
# Application
# =========================================
spring.application.name=subsidyDisbursement

# =========================================
# Server
# =========================================
server.port=8080

# =========================================
# MySQL Database
# =========================================
spring.datasource.url=jdbc:mysql://localhost:3306/subsidy_disbursement?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# =========================================
# JPA / Hibernate
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================
# Database Driver
# =========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# File Upload
# =========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# =========================================
# JWT Configuration
# =========================================
jwt.secret=${JWT_SECRET}

# =========================================
# Admin User Configuration (Owner)
# =========================================
app.admin.name=System Administrator
app.admin.email=Admin@grandsystem.com
app.admin.password=${ADMIN_PASSWORD}